[package]
name = "mes-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mes-core"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:config", "dep:question"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.3"
unicode-segmentation = "1.13.2"
clap = { version = "4.6.0", features = ["derive"], optional = true }
config = { version = "0.15.22", optional = true }
question = { version = "0.2.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
